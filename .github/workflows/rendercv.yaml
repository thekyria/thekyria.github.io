name: Render CV

on:
  workflow_call: # reused by pages.yaml, release.yaml and pr.yaml

permissions:
  contents: read

jobs:
  rendercv:
    name: RenderCV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install RenderCV
        run: pip install -r cv/requirements.txt
      - name: RenderCV
        # Output options live under `settings:` in the YAML; this writes build/thekyria_CV.pdf
        run: rendercv render cv/thekyria_CV.yaml
      - name: Upload CV PDF as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: build/thekyria_CV.pdf
          if-no-files-found: error
