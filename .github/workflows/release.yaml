name: Release a CV

on:
  push:
    tags:
      - "v*" # Version tags, e.g. v2026.04.30

permissions:
  contents: write

jobs:
  rendercv:
    name: RenderCV
    uses: ./.github/workflows/rendercv.yaml

  release:
    needs: rendercv
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download CV PDF
        uses: actions/download-artifact@v8
        with:
          name: cv-pdf
          path: build
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/thekyria_CV.pdf
          generate_release_notes: true
          make_latest: true
