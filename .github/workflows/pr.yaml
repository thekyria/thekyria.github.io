name: Check CV

on:
  pull_request:

permissions:
  contents: read

jobs:
  rendercv:
    name: RenderCV
    uses: ./.github/workflows/rendercv.yaml

  radar:
    name: Check tech radar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate tech_radar.json
        run: python3 radar/check.py
