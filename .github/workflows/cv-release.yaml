name: Release a CV

on:
  push:
    tags:
      - "v*" # Version tags, e.g. v2026.04.30

permissions:
  contents: read

jobs:
  rendercv:
    name: RenderCV
    uses: ./.github/workflows/rendercv.yaml

  release:
    needs: rendercv
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # History and tags, for the release notes
      - name: Download CV PDF
        uses: actions/download-artifact@v8
        with:
          name: cv-pdf
          path: build
      - name: Write release notes
        # Only the CV changes since the previous release, not every pull request in the repository
        run: |
          prev="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -z "${prev}" ]; then
            echo "First CV release." > build/notes.md
          else
            changes="$(git log --no-merges --format='- %s' "${prev}..${GITHUB_REF_NAME}" -- cv/)"
            printf 'CV changes since %s:\n\n%s\n' "${prev}" "${changes:-- None}" > build/notes.md
          fi
          cat build/notes.md
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/thekyria_CV.pdf
          body_path: build/notes.md
          make_latest: true

  deploy-site:
    name: Deploy the site with the new CV
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run the site deployment on main
        # Dispatched rather than called, so that it runs on main, which the github-pages
        # environment allows to deploy, and picks up the release just made
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yaml --repo "${GITHUB_REPOSITORY}" --ref main
