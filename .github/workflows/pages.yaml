name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  rendercv:
    name: RenderCV
    uses: ./.github/workflows/rendercv.yaml

  build:
    needs: rendercv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download CV PDF into the site
        uses: actions/download-artifact@v8
        with:
          name: cv-pdf
          path: site
      - name: Copy tech radar data into the site
        # Rendered by radar.thoughtworks.com, which fetches it from the published site
        run: cp radar/tech_radar.json site/
      - name: Stamp the deployed commit into the footer
        # The site is deployed continuously, so the deployed git commit acts as the version,
        # and its date gives the copyright year
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/commit/${GITHUB_SHA}"
          version="<span>Version <a class=\"commit\" href=\"${url}\" title=\"Commit ${GITHUB_SHA}\">${GITHUB_SHA::7}</a></span>"
          year="$(git log -1 --format=%cd --date=format:%Y "${GITHUB_SHA}")"
          grep -q '<!-- version -->' site/index.html
          grep -q '<!-- year -->' site/index.html
          sed -i -e "s|<!-- version -->|${version}|" -e "s|<!-- year -->| ${year}|" site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
