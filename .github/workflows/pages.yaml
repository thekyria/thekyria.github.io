name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  rendercv:
    name: RenderCV
    uses: ./.github/workflows/rendercv.yaml

  build:
    needs: rendercv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download CV PDF into the site
        uses: actions/download-artifact@v8
        with:
          name: cv-pdf
          path: site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
