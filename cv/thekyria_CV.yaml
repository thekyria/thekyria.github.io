design:
  theme: engineeringresumes

  page:
    size: a4
    top_margin: 2.5cm
    bottom_margin: 2.5cm
    left_margin: 2.5cm
    right_margin: 2.5cm
    show_footer: false
    show_top_note: false

  colors:
    body: rgb(0, 0, 0)
    name: rgb(0, 0, 0)
    headline: rgb(0, 0, 0)
    connections: rgb(0, 79, 144)
    section_titles: rgb(0, 0, 0)
    links: rgb(0, 79, 144)
    footer: rgb(0, 0, 0)
    top_note: rgb(0, 0, 0)

  typography:
    line_spacing: 0.6em
    alignment: justified
    date_and_location_column_alignment: right
    font_family: "Latin Modern Roman"
    font_size:
      body: 10pt
      name: 30pt
      headline: 10pt
      connections: 10pt
      section_titles: 1.4em
    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: false
    bold:
      name: false
      headline: false
      connections: false
      section_titles: false

  links:
    underline: false
    show_external_link_icon: true

  header:
    alignment: center 
    connections:
      phone_number_format: international 
      hyperlink: true
      show_icons: true
      display_urls_instead_of_usernames: false
      separator: ''
      space_between_connections: 0.5cm

  section_titles:
    type: with_full_line 
    line_thickness: 0.5pt
    space_above: 0.5cm
    space_below: 0.3cm

  sections:
    allow_page_break: true
    space_between_regular_entries: 1.2em
    space_between_text_based_entries: 0.3em
